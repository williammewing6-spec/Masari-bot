name = "masari-bot"
main = "src/index.js"
compatibility_date = "2024-11-01"

# BOT_TOKEN is a secret (dashboard / wrangler secret put BOT_TOKEN).
# WEBHOOK_SECRET is a secret set by Muse at deploy time.
# ADMIN_ID is the owner's Telegram numeric id (set after his first /start).

[[d1_databases]]
binding = "DB"
database_name = "masari_db"
database_id = "c87c1b95-3237-48c2-8bcf-04436429205e"

[triggers]
crons = ["17 * * * *"]   # hourly: auto-approve stale client-reviewed proofs
